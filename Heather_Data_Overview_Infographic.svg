<svg viewBox="0 0 1600 690" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#123C4A"/>
      <stop offset="100%" stop-color="#1D6E86"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="690" fill="#F7F9FA"/>

  <!-- Header band -->
  <rect width="1600" height="150" fill="url(#hero)"/>
  <text x="80" y="70" fill="#FFFFFF" font-size="34" font-weight="700" font-style="italic">Dana Point PULSE</text>
  <text x="80" y="108" fill="#B9D6E0" font-size="18" letter-spacing="1">How your data moves, in brief</text>
  <text x="1520" y="70" fill="#8FC4D6" font-size="15" text-anchor="end">Prepared for Heather Johnston</text>
  <text x="1520" y="94" fill="#8FC4D6" font-size="15" text-anchor="end">Visit Dana Point</text>

  <!-- 5 columns -->
  <!-- Column width ~ 288, gap 24, start x 64 -->

  <!-- Card template positions -->
  <!-- Card 1: Where it's stored -->
  <g transform="translate(64,190)">
    <rect width="288" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect width="288" height="8" rx="4" fill="#1D6E86"/>
    <circle cx="144" cy="90" r="46" fill="#EAF3F5"/>
    <!-- database icon -->
    <g transform="translate(144,90)">
      <ellipse cx="0" cy="-18" rx="26" ry="10" fill="#1D6E86"/>
      <rect x="-26" y="-18" width="52" height="36" fill="#1D6E86"/>
      <ellipse cx="0" cy="18" rx="26" ry="10" fill="#123C4A"/>
      <ellipse cx="0" cy="-18" rx="26" ry="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    </g>
    <text x="144" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Where Data Lives</text>
    <text x="144" y="200" text-anchor="middle" font-size="14.5" fill="#334155">One database.</text>
    <text x="144" y="222" text-anchor="middle" font-size="14.5" fill="#334155">Every STR, Datafy,</text>
    <text x="144" y="244" text-anchor="middle" font-size="14.5" fill="#334155">and CoStar file feeds it.</text>
    <line x1="30" y1="280" x2="258" y2="280" stroke="#E2E8F0"/>
    <text x="144" y="320" text-anchor="middle" font-size="13" fill="#64748B">Nothing is scattered</text>
    <text x="144" y="340" text-anchor="middle" font-size="13" fill="#64748B">across separate files.</text>
  </g>

  <!-- Card 2: How it updates -->
  <g transform="translate(376,190)">
    <rect width="288" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect width="288" height="8" rx="4" fill="#B45309"/>
    <circle cx="144" cy="90" r="46" fill="#FBEEE4"/>
    <!-- upload arrow icon -->
    <g transform="translate(144,90)" stroke="#B45309" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="20" x2="0" y2="-20"/>
      <polyline points="-16,-6 0,-22 16,-6"/>
      <line x1="-24" y1="26" x2="24" y2="26"/>
    </g>
    <text x="144" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">How It Updates</text>
    <text x="144" y="200" text-anchor="middle" font-size="14.5" fill="#334155">Upload a file anytime,</text>
    <text x="144" y="222" text-anchor="middle" font-size="14.5" fill="#334155">right on the dashboard.</text>
    <text x="144" y="244" text-anchor="middle" font-size="14.5" fill="#334155">STR also syncs weekly.</text>
    <line x1="30" y1="280" x2="258" y2="280" stroke="#E2E8F0"/>
    <text x="144" y="320" text-anchor="middle" font-size="13" fill="#64748B">No IT ticket.</text>
    <text x="144" y="340" text-anchor="middle" font-size="13" fill="#64748B">No email attachments.</text>
  </g>

  <!-- Card 3: You own it -->
  <g transform="translate(688,190)">
    <rect width="288" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect width="288" height="8" rx="4" fill="#1D9E6F"/>
    <circle cx="144" cy="90" r="46" fill="#E6F5EE"/>
    <!-- shield/check icon -->
    <g transform="translate(144,90)">
      <path d="M0,-28 L26,-16 L26,8 C26,26 12,34 0,40 C-12,34 -26,26 -26,8 L-26,-16 Z" fill="#1D9E6F"/>
      <polyline points="-11,2 -2,12 14,-10" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="144" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">You Own It</text>
    <text x="144" y="200" text-anchor="middle" font-size="14.5" fill="#334155">No Power BI license.</text>
    <text x="144" y="222" text-anchor="middle" font-size="14.5" fill="#334155">No Microsoft tenant.</text>
    <text x="144" y="244" text-anchor="middle" font-size="14.5" fill="#334155">Your team adds data.</text>
    <line x1="30" y1="280" x2="258" y2="280" stroke="#E2E8F0"/>
    <text x="144" y="320" text-anchor="middle" font-size="13" fill="#64748B">Can move to your own</text>
    <text x="144" y="340" text-anchor="middle" font-size="13" fill="#64748B">domain whenever you like.</text>
  </g>

  <!-- Card 4: More than a PDF -->
  <g transform="translate(1000,190)">
    <rect width="288" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect width="288" height="8" rx="4" fill="#1D6E86"/>
    <circle cx="144" cy="90" r="46" fill="#EAF3F5"/>
    <!-- chart/screen icon -->
    <g transform="translate(144,90)">
      <rect x="-28" y="-22" width="56" height="38" rx="4" fill="#FFFFFF" stroke="#1D6E86" stroke-width="4"/>
      <rect x="-19" y="2" width="8" height="10" fill="#1D6E86"/>
      <rect x="-5" y="-6" width="8" height="18" fill="#1D6E86"/>
      <rect x="9" y="-14" width="8" height="26" fill="#1D6E86"/>
      <line x1="-14" y1="24" x2="14" y2="24" stroke="#1D6E86" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="144" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">More Than a PDF</text>
    <text x="144" y="200" text-anchor="middle" font-size="14.5" fill="#334155">Live charts, your own</text>
    <text x="144" y="222" text-anchor="middle" font-size="14.5" fill="#334155">notes, and the PDF</text>
    <text x="144" y="244" text-anchor="middle" font-size="14.5" fill="#334155">report, all in one place.</text>
    <line x1="30" y1="280" x2="258" y2="280" stroke="#E2E8F0"/>
    <text x="144" y="320" text-anchor="middle" font-size="13" fill="#64748B">Notes carry into</text>
    <text x="144" y="340" text-anchor="middle" font-size="13" fill="#64748B">the PDF automatically.</text>
  </g>

  <!-- Card 5: Share it -->
  <g transform="translate(1312,190)">
    <rect width="288" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect width="288" height="8" rx="4" fill="#A8461F"/>
    <circle cx="144" cy="90" r="46" fill="#FBE4D5"/>
    <!-- link icon -->
    <g transform="translate(144,90)" stroke="#A8461F" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M-8,-14 L8,-14 A16,16 0 0 1 8,18"/>
      <path d="M8,14 L-8,14 A16,16 0 0 1 -8,-18"/>
    </g>
    <text x="144" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Share It</text>
    <text x="144" y="200" text-anchor="middle" font-size="14.5" fill="#334155">One link. Hotel</text>
    <text x="144" y="222" text-anchor="middle" font-size="14.5" fill="#334155">partners can browse</text>
    <text x="144" y="244" text-anchor="middle" font-size="14.5" fill="#334155">history anytime.</text>
    <line x1="30" y1="280" x2="258" y2="280" stroke="#E2E8F0"/>
    <text x="144" y="320" text-anchor="middle" font-size="13" fill="#64748B">Works on desktop</text>
    <text x="144" y="340" text-anchor="middle" font-size="13" fill="#64748B">and mobile.</text>
  </g>

  <!-- Flow arrows between card 1 and 2, 2 and 3, etc, at mid height of icons -->
  <g stroke="#94A3B8" stroke-width="3" fill="none">
    <line x1="358" y1="280" x2="370" y2="280"/>
    <polygon points="370,273 382,280 370,287" fill="#94A3B8"/>
    <line x1="670" y1="280" x2="682" y2="280"/>
    <polygon points="682,273 694,280 682,287" fill="#94A3B8"/>
    <line x1="982" y1="280" x2="994" y2="280"/>
    <polygon points="994,273 1006,280 994,287" fill="#94A3B8"/>
    <line x1="1294" y1="280" x2="1306" y2="280"/>
    <polygon points="1306,273 1318,280 1306,287" fill="#94A3B8"/>
  </g>

  <!-- Footer -->
  <rect y="630" width="1600" height="60" fill="#123C4A"/>
  <text x="80" y="666" fill="#DCEEF4" font-size="14">vdppulse.gloconsolutions.com</text>
  <text x="1520" y="666" fill="#DCEEF4" font-size="14" text-anchor="end">Prepared by GloCon Solutions LLC</text>
</svg>
