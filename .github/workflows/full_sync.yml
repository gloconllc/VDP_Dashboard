# ============================================================================
# VDP Analytics — Full Source Sync (STR + CoStar + Datafy)
# ============================================================================
#
# STATUS: SKELETON, PAUSED (2026-08-19). The automatic Sunday schedule is
# commented out on purpose until Heather's actual upload folder(s) are
# confirmed (Dropbox vs. a new SharePoint folder under Visit Dana Point's own
# tenant — see OPEN ITEM below). workflow_dispatch (manual "Run workflow")
# still works right now against the CURRENT known Dropbox/Drive folders, so
# it's safe to test with. Once the real folder is confirmed:
#   1. Point STR_DROPBOX_WEEKLY_URL / STR_DROPBOX_MONTHLY_URL (or a new
#      SharePoint mechanism, see below) at the right folder.
#   2. Confirm/set DRIVE_FOLDER_COSTAR / DRIVE_FOLDER_DATAFY.
#   3. Uncomment the `schedule:` block below.
# No other code changes should be needed for a same-mechanism folder change.
#
# Purpose: keep the live dashboard current with whatever Heather (or her team)
# drops into the shared data folder, without waiting for a Thursday-only STR
# check or the once-a-month full pipeline run.
#
# Trigger (once unpaused):
#   - On demand: from the Actions tab, open "Full Source Sync (STR + CoStar +
#     Datafy)" and click "Run workflow" any time new files have gone in.
#   - Automatically every Sunday night, Pacific time, so nothing is ever more
#     than a week stale even if no one remembers to trigger it manually.
#
# Scope: STR, CoStar, and Datafy only — the three sources Heather uploads.
# The other ~25 external data sources (weather, TSA, Census, etc.) stay on
# the existing monthly full pipeline (pipeline.yml); they don't come from
# Heather's folder and don't need this cadence.
#
# OPEN ITEM (2026-08-19): the exact source folder still needs to be confirmed
# with Heather — is she still using the Dropbox "2026" folder already wired
# into fetch_str_dropbox.py, or has she moved to a SharePoint folder under
# Visit Dana Point's own tenant (per her ownership request in her email)?
# fetch_str_dropbox.py now reads STR_DROPBOX_WEEKLY_URL/STR_DROPBOX_MONTHLY_URL
# env vars (falling back to the current known-good Dropbox folder), so a NEW
# DROPBOX FOLDER is just a secret away. A move to SHAREPOINT is NOT a same-script
# swap — SharePoint needs Microsoft Graph API auth, a different mechanism
# entirely, and would need a new fetch_str_sharepoint.py written and added as
# its own step below. Do not assume this is fully wired until the folder and
# mechanism are confirmed.
#
# SECRETS USED (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY            — used by compute_insights.py
#   DROPBOX_API_TOKEN            — optional, see fetch_str_dropbox.py
#   STR_DROPBOX_WEEKLY_URL       — optional override; only needed if the STR
#                                  Dropbox folder link changes
#   STR_DROPBOX_MONTHLY_URL      — optional override; same as above
#   GOOGLE_SERVICE_ACCOUNT_JSON  — needed for the CoStar/Datafy Drive sync step
#   DRIVE_FOLDER_COSTAR          — Google Drive folder ID for CoStar exports
#   DRIVE_FOLDER_DATAFY          — Google Drive folder ID for Datafy exports
#
#   VERIFY BEFORE RELYING ON THIS: pipeline.yml already references the Drive
#   secrets above for its monthly run, but that doesn't confirm they're
#   actually set — check Settings → Secrets and variables → Actions directly.
#
# ============================================================================

name: Full Source Sync (STR + CoStar + Datafy)

on:
  # Manual trigger — safe to use right now against the current known folders,
  # even while the schedule below stays paused.
  workflow_dispatch: {}

  # PAUSED (2026-08-19) — uncomment once Heather's folder is confirmed.
  # Sunday 10:00 PM Pacific = Monday 05:00 UTC during PDT (Mar-Nov).
  # During PST (Nov-Mar) this lands at 9:00 PM Pacific instead.
  # schedule:
  #   - cron: "0 5 * * 1"

jobs:
  full-sync:
    name: Sync STR + CoStar + Datafy, reload, redeploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install \
            "google-auth>=2.0.0,<3.0.0" \
            "google-auth-httplib2>=0.2.0,<1.0.0" \
            "google-api-python-client>=2.0.0,<3.0.0"

      # -----------------------------------------------------------------------
      # STR: public Dropbox shared folder, no token strictly required.
      # STR_DROPBOX_WEEKLY_URL / STR_DROPBOX_MONTHLY_URL are optional — if
      # unset, fetch_str_dropbox.py falls back to the current known-good
      # Dropbox folder. Set these once Heather's actual folder is confirmed
      # (if she stays on Dropbox — see OPEN ITEM above for the SharePoint case).
      # -----------------------------------------------------------------------
      - name: Sync STR files from Dropbox
        env:
          DROPBOX_API_TOKEN: ${{ secrets.DROPBOX_API_TOKEN }}
          STR_DROPBOX_WEEKLY_URL: ${{ secrets.STR_DROPBOX_WEEKLY_URL }}
          STR_DROPBOX_MONTHLY_URL: ${{ secrets.STR_DROPBOX_MONTHLY_URL }}
        run: python scripts/fetch_str_dropbox.py || echo "No new STR files or sync issue — continuing with existing local files."

      # -----------------------------------------------------------------------
      # CoStar + Datafy: Google Drive folders via service account. Skipped
      # cleanly (with a clear log line) if the service account secret isn't
      # configured yet, rather than failing the whole run.
      # -----------------------------------------------------------------------
      - name: Write Google service account key
        if: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > /tmp/sa_key.json
          chmod 600 /tmp/sa_key.json

      - name: Sync CoStar + Datafy files from Google Drive
        if: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: /tmp/sa_key.json
          DRIVE_FOLDER_COSTAR: ${{ secrets.DRIVE_FOLDER_COSTAR }}
          DRIVE_FOLDER_DATAFY: ${{ secrets.DRIVE_FOLDER_DATAFY }}
        run: python scripts/sync_from_drive.py || echo "Drive sync issue — continuing with existing local files."

      - name: Warn if Drive sync was skipped
        if: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON == '' }}
        run: echo "::warning::GOOGLE_SERVICE_ACCOUNT_JSON is not set — CoStar/Datafy Drive sync was skipped this run. Loaders below will only see whatever is already committed in data/costar/ and data/datafy/."

      # -----------------------------------------------------------------------
      # Reload STR + CoStar + Datafy, recompute KPIs and insights.
      # -----------------------------------------------------------------------
      - name: Reload STR + CoStar + Datafy, recompute KPIs and insights
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/load_str_daily_sqlite.py
          python scripts/load_str_monthly_sqlite.py
          python scripts/load_str_multiseg.py || true
          python scripts/load_str_response_sheets.py || true
          python scripts/load_str_translation_table.py || true
          python scripts/compute_kpis.py
          python scripts/load_datafy_reports.py || true
          python scripts/load_costar_reports.py || true
          python scripts/load_costar_market_daily.py || true
          python scripts/seed_group_benchmarks.py || true
          python scripts/compute_insights.py
          python scripts/optimize_db.py || true
          python scripts/build_table_relationships.py || true

      # -----------------------------------------------------------------------
      # Commit and push straight to main — Railway auto-redeploys from main,
      # so this is the step that puts fresh numbers on the live app.
      # -----------------------------------------------------------------------
      - name: Commit updated data to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/analytics.sqlite
          git add data/str/ data/costar/ data/datafy/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit — STR/CoStar/Datafy data is already up to date."
          else
            RUN_DATE=$(date -u +"%Y-%m-%d")
            git commit -m "chore: full source sync ${RUN_DATE} [automated]"
            git push origin main
            echo "Changes committed and pushed to main — Railway will redeploy automatically."
          fi
