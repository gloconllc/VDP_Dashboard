[theme]
# The dashboard renders on a WHITE page. This block used to declare base="dark"
# with textColor="#F4FAFF", left over from the pre-redesign dark build. The app's
# own CSS forced the surfaces light but never overrode Streamlit's generated text
# color, so every element the custom CSS did not explicitly recolor (tab labels,
# widget labels, captions) inherited near-white text on white. Inactive tab
# labels measured 1.05:1 contrast against the tab bar, effectively invisible.
#
# These values match tokens the app already uses: textColor is chart_theme
# INK_BODY, primaryColor is the validated palette primary, and
# secondaryBackgroundColor is the existing tab-bar surface.
base = "light"
primaryColor = "#0891B2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#334155"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
# Default toolbar mode shows a "Deploy" button, GitHub/star icon, and other
# Streamlit-branded chrome in the top-right corner, visible from first paint
# (before app content or our custom splash JS has anything to hide). That is
# almost certainly what read as "seeing Streamlit" on load. Minimal mode keeps
# only the running-status spinner and drops every Streamlit-branded control.
toolbarMode = "minimal"
